name: Ruby RSpec Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run RSpec
        run: |
          bundle exec rspec

  commit_lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Auto-commit Gemfile.lock
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update Gemfile.lock by GitHub Actions"
          file_pattern: 'Gemfile.lock'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run RSpec
        run: |
          bundle exec rspec

      - name: Auto-commit Gemfile.lock
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update Gemfile.lock by GitHub Actions"
          file_pattern: 'Gemfile.lock'
